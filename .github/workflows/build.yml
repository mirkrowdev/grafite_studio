name: Build & Release Grafite

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione (es. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: grafite-linux
            binary: grafite
          - os: windows-latest
            artifact: grafite-windows
            binary: grafite.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r sketch2stampa/requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pyinstaller --onefile --windowed --name grafite \
              --version-file sketch2stampa/version_info.txt \
              sketch2stampa/app.py
          else
            pyinstaller --onefile --windowed --name grafite sketch2stampa/app.py
          fi

      - name: Rename binary with version
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv grafite.exe "grafite-${{ inputs.version }}-windows.exe"
          else
            mv grafite "grafite-${{ inputs.version }}-linux"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Grafite v${{ inputs.version }}
          files: artifacts/**/*
